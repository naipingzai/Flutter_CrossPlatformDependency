# ============================================================
# sqlite 第三方依赖配置
# ============================================================
# 本仓库只负责获取源码、跨平台编译静态库并发布产物。
# 消费方（APP）只下载编译好的 include/ 与 lib/，不参与编译过程。
#
# 输出统一结构：
#   include/          sqlite3.h
#   lib/              libsqlite3.a
#
# 构建：
#   - 构建逻辑：dependencies/sqlite/build.sh（完全自包含，autoconf）
#   - 平台配置：.github/workflows/build_sqlite.yml
# ============================================================

name: sqlite
version: "3460100"

source:
  url: https://www.sqlite.org/2024/sqlite-autoconf-3460100.tar.gz
  sha256: ""

build:
  type: static              # 静态库（.a）
  engine: autoconf          # ./configure + make（见 build.sh 规则 D）
  output:
    include: include/
    lib: lib/

platforms:
  windows:
    enabled: true
    arch: [x86_64]
  linux:
    enabled: true
    arch: [x86_64]
  macos:
    enabled: true
    arch: [arm64]
  android:
    enabled: true
    abi: [arm64-v8a]
    min_sdk: 21
  ios:
    enabled: true
    arch: [arm64]
