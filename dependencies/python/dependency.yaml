# ============================================================
# Python 第三方依赖配置（嵌入式解释器静态库）
# ============================================================
# 产物：可直接被 APP 静态链接的嵌入式 Python 环境。
#   include/python3.x/   头文件（Python.h 等）
#   lib/libpython3.x.a   静态解释器库
#   lib/python3.x/       标准库（stdlib）
#
# 构建逻辑：dependencies/python/build.sh（完全自包含，规则在脚本内标注）
# 平台配置：.github/workflows/build_python.yml
# ============================================================

name: python
version: "3.12.7"

source:
  url: https://www.python.org/ftp/python/3.12.7/Python-3.12.7.tgz
  sha256: ""

build:
  type: static              # 嵌入式静态库（libpython3.x.a）
  engine: autoconf          # ./configure + make（CPython 特性见 build.sh）
  output:
    include: include/
    lib: lib/
    # lib/ 内含 libpython3.x.a 与 python3.x/（标准库）

platforms:
  linux:
    enabled: true
    arch: [x86_64]
  macos:
    enabled: true
    arch: [arm64]
  android:
    enabled: true
    abi: [arm64-v8a]
    # 交叉编译需提供与目标同版本的 BUILD_PYTHON（进阶，见 README 注意事项）
  ios:
    enabled: true
    arch: [arm64]
    # 上游 CPython autoconf 不支持 iOS 交叉编译，
    # 改用 pybee/Python-Apple-support 构建（见 build_ios.sh）
  windows:
    enabled: true
    arch: [x86_64]
    # MinGW-w64 方式（进阶，见 README 注意事项）
