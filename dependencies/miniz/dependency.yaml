# ============================================================
# miniz 第三方依赖配置
# ============================================================
# 本仓库只负责获取源码、跨平台编译静态库并发布产物。
# 消费方（APP）只下载编译好的 include/ 与 lib/，不参与编译过程。
#
# 输出统一结构：
#   include/          头文件（miniz.h 及依赖头）
#   lib/              静态库（libminiz.a）
#
# 构建：
#   - 构建逻辑：dependencies/miniz/build.sh（完全自包含，无 autoconf，直接编译）
#   - 平台配置：.github/workflows/build_miniz.yml
# ============================================================

name: miniz
version: "2.2.0"

source:
  url: https://github.com/richgel999/miniz/archive/refs/tags/2.2.0.tar.gz
  sha256: ""

build:
  type: static              # 静态库（.a）
  engine: direct            # 无 autoconf，直接编译（见 build.sh 规则 D）
  output:
    include: include/
    lib: lib/

platforms:
  windows:
    enabled: true
    arch: [x86_64]
  linux:
    enabled: true
    arch: [x86_64]
  macos:
    enabled: true
    arch: [arm64]
  android:
    enabled: true
    abi: [arm64-v8a]
    min_sdk: 21
  ios:
    enabled: true
    arch: [arm64]
