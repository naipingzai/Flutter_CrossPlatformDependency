# ============================================================
# build_python.yml
# ============================================================
# 编译可嵌入的 CPython 静态库（libpython3.x.a + 标准库 + 头文件）。
#
# 平台差异（runner / 工具链 / 交叉三元组 / 主机 python）集中在本 YAML。
# 构建逻辑在自包含的 dependencies/python/build.sh。
#
# 说明：
#   - Linux / macOS：原生 configure + make（已在本机验证可嵌入）。
#   - Android / iOS / Windows(MinGW)：交叉编译，需 HOST_TRIPLE 与
#     同版本的 BUILD_PYTHON（主机 python）。为进阶能力，可能需要迭代。
#
# 产物：python/<plat>/<arch>/{include,lib}，打包为 python-<plat>.tar.gz。
# 触发：手动 workflow_dispatch 或 push tag（python-*）。
# ============================================================

name: Build Python Static Libs

on:
  workflow_dispatch:
  push:
    tags:
      - 'python-*'

permissions:
  contents: write

env:
  RELEASE_TAG: "python-3.12.7"

jobs:
  # ============================================================
  # Linux: x86_64（原生，已验证）
  # ============================================================
  linux:
    name: Linux x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PLATFORM: linux
      ARCH: x86_64
      ARCH_DIR: x86_64
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y make gcc g++ zlib1g-dev libffi-dev xz-utils curl
      - name: Build
        run: bash dependencies/python/build.sh
      - name: Package
        run: |
          cd "${RUNNER_TEMP}/python-stage/python"
          tar -czf "${RUNNER_TEMP}/python-linux.tar.gz" linux
      - uses: actions/upload-artifact@v4
        with:
          name: python-linux
          path: ${{ runner.temp }}/python-linux.tar.gz
          if-no-files-found: error

  # ============================================================
  # macOS: arm64（原生）
  # ============================================================
  macos:
    name: macOS arm64
    runs-on: macos-14
    timeout-minutes: 120
    env:
      PLATFORM: macos
      ARCH: arm64
      ARCH_DIR: arm64
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: bash dependencies/python/build.sh
      - name: Package
        run: |
          cd "${RUNNER_TEMP}/python-stage/python"
          tar -czf "${RUNNER_TEMP}/python-macos.tar.gz" macos
      - uses: actions/upload-artifact@v4
        with:
          name: python-macos
          path: ${{ runner.temp }}/python-macos.tar.gz
          if-no-files-found: error

  # ============================================================
  # Windows: x86_64（MSYS2/MinGW64 原生构建，进阶）
  # ============================================================
  windows:
    name: Windows x86_64 (MinGW)
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: msys2 {0}
    env:
      PLATFORM: windows
      ARCH: x86_64
      ARCH_DIR: x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git make tar mingw-w64-x86_64-gcc mingw-w64-x86_64-zlib
            mingw-w64-x86_64-libffi mingw-w64-x86_64-expat
      - name: Build
        run: bash dependencies/python/build.sh
      - name: Package
        run: |
          STAGE="$(cygpath -u "${RUNNER_TEMP}/python-stage/python")"
          OUT="$(cygpath -u "${RUNNER_TEMP}/python-windows.tar.gz")"
          cd "${STAGE}"
          tar -czf "${OUT}" windows
      - uses: actions/upload-artifact@v4
        with:
          name: python-windows
          path: ${{ runner.temp }}/python-windows.tar.gz
          if-no-files-found: error

  # ============================================================
  # Android: arm64-v8a（交叉编译，进阶）
  # ============================================================
  android:
    name: Android arm64-v8a
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      PLATFORM: android
      ARCH: aarch64
      ARCH_DIR: arm64-v8a
      HOST_TRIPLE: aarch64-linux-android
      BUILD_TRIPLE: x86_64-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - name: Host python (3.12)
        uses: actions/setup-python@v5
        id: hostpy
        with:
          python-version: '3.12'
      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
          add-to-path: false
      - name: Build
        env:
          NDK: ${{ steps.ndk.outputs.ndk-path }}
          TC: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64
          BUILD_PYTHON: ${{ steps.hostpy.outputs.python-path }}
          CC: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang
          CXX: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang++
          AR: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          RANLIB: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ranlib
          STRIP: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip
          SYSROOT: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot
        run: bash dependencies/python/build.sh
      - name: Package
        run: |
          cd "${RUNNER_TEMP}/python-stage/python"
          tar -czf "${RUNNER_TEMP}/python-android.tar.gz" android
      - uses: actions/upload-artifact@v4
        with:
          name: python-android
          path: ${{ runner.temp }}/python-android.tar.gz
          if-no-files-found: error

  # ============================================================
  # Release: 汇总各平台 tarball 并发布
  # 注：iOS 上游 CPython 不支持 autoconf 交叉编译，故不纳入本工作流。
  # ============================================================
  release:
    name: Publish Release
    runs-on: ubuntu-24.04
    needs: [linux, macos, windows, android]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: List assets
        run: ls -lh release-assets/
      - name: Create/Update Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          gh release delete "${RELEASE_TAG}" --yes --cleanup-tag 2>/dev/null || true
          gh release create "${RELEASE_TAG}" \
            --title "Python ${RELEASE_TAG}" \
            --notes "Python ${RELEASE_TAG} 嵌入式静态库（libpython3.x.a + 标准库 + 头文件）" \
            $(find release-assets -type f -name '*.tar.gz')
          echo "Release 创建完成: ${RELEASE_TAG}"
