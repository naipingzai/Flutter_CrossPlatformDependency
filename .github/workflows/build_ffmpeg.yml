# ============================================================
# build_ffmpeg.yml
# ============================================================
# 编译 FFmpeg n7.1 各平台静态库并发布到 GitHub Release。
#
# 触发：
#   - 手动 workflow_dispatch
#   - push tag（ffmpeg-*）
#
# 每个平台 Job 产出：ffmpeg/<plat>/<arch>/{include,lib}，
# 打包为 ffmpeg-<plat>.tar.gz 上传（workflow artifact）。
# release Job 汇总所有平台 tarball 并上传到 GitHub Release
# （tag: ffmpeg-n7.1）。
#
# APP 端消费：
#   https://github.com/naipingzai/Flutter_CrossPlatformDependency/releases/download/ffmpeg-n7.1/ffmpeg-<plat>.tar.gz
# ============================================================

name: Build FFmpeg Static Libs

on:
  workflow_dispatch:
  push:
    tags:
      - 'ffmpeg-*'

permissions:
  contents: write

env:
  RELEASE_TAG: "ffmpeg-n7.1"

jobs:
  # ============================================================
  # Linux: x86_64 + aarch64
  # ============================================================
  linux:
    name: Linux (x86_64 + aarch64)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm yasm make gcc g++ xz-utils curl
      - name: Build FFmpeg (Linux)
        run: bash dependencies/ffmpeg/scripts/build_linux.sh
      - name: Package
        run: |
          cd "${RUNNER_TEMP}/ffmpeg-stage/ffmpeg"
          tar -czf "${RUNNER_TEMP}/ffmpeg-linux.tar.gz" linux
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-linux
          path: ${{ runner.temp }}/ffmpeg-linux.tar.gz
          if-no-files-found: error

  # ============================================================
  # Windows: x86_64 (MSYS2/MinGW64)
  # ============================================================
  windows:
    name: Windows (x86_64)
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git make tar mingw-w64-x86_64-gcc mingw-w64-x86_64-nasm
            mingw-w64-x86_64-xz mingw-w64-x86_64-pkgconf
      - name: Build FFmpeg (Windows)
        run: bash dependencies/ffmpeg/scripts/build_windows.sh
      - name: Package
        run: |
          STAGE="$(cygpath -u "${RUNNER_TEMP}/ffmpeg-stage/ffmpeg")"
          OUT="$(cygpath -u "${RUNNER_TEMP}/ffmpeg-windows.tar.gz")"
          cd "${STAGE}"
          tar -czf "${OUT}" windows
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-windows
          path: ${{ runner.temp }}/ffmpeg-windows.tar.gz
          if-no-files-found: error

  # ============================================================
  # macOS: universal (arm64 + x86_64)
  # ============================================================
  macos:
    name: macOS (universal)
    runs-on: macos-14
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Build FFmpeg (macOS)
        run: bash dependencies/ffmpeg/scripts/build_macos.sh
      - name: Package
        run: |
          cd "${RUNNER_TEMP}/ffmpeg-stage/ffmpeg"
          tar -czf "${RUNNER_TEMP}/ffmpeg-macos.tar.gz" macos
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-macos
          path: ${{ runner.temp }}/ffmpeg-macos.tar.gz
          if-no-files-found: error

  # ============================================================
  # Android: armeabi-v7a / arm64-v8a / x86 / x86_64
  # ============================================================
  android:
    name: Android (4 ABIs)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        id: setup_ndk
        with:
          ndk-version: r27c
          add-to-path: false
      - name: Build FFmpeg (Android)
        env:
          NDK_ROOT: ${{ steps.setup_ndk.outputs.ndk-path }}
        run: bash dependencies/ffmpeg/scripts/build_android.sh
      - name: Package
        run: |
          cd "${RUNNER_TEMP}/ffmpeg-stage/ffmpeg"
          tar -czf "${RUNNER_TEMP}/ffmpeg-android.tar.gz" android
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-android
          path: ${{ runner.temp }}/ffmpeg-android.tar.gz
          if-no-files-found: error

  # ============================================================
  # iOS: arm64 真机
  # ============================================================
  ios:
    name: iOS (arm64)
    runs-on: macos-14
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Build FFmpeg (iOS)
        run: bash dependencies/ffmpeg/scripts/build_ios.sh
      - name: Package
        run: |
          cd "${RUNNER_TEMP}/ffmpeg-stage/ffmpeg"
          tar -czf "${RUNNER_TEMP}/ffmpeg-ios.tar.gz" ios
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-ios
          path: ${{ runner.temp }}/ffmpeg-ios.tar.gz
          if-no-files-found: error

  # ============================================================
  # Release: 汇总各平台 tarball 并创建/更新 GitHub Release
  # ============================================================
  release:
    name: Publish Release
    runs-on: ubuntu-24.04
    needs: [linux, windows, macos, android, ios]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: List assets
        run: ls -lh release-assets/
      - name: Create/Update Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          gh release delete "${RELEASE_TAG}" --yes --cleanup-tag 2>/dev/null || true
          gh release create "${RELEASE_TAG}" \
            --title "FFmpeg ${RELEASE_TAG}" \
            --notes "FFmpeg n7.1 跨平台静态库（include + lib/<plat>/<arch>）" \
            $(find release-assets -type f -name '*.tar.gz')
          echo "Release 创建完成: ${RELEASE_TAG}"
