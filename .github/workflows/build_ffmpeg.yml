# ============================================================
# build_ffmpeg.yml
# ============================================================
# 编译 FFmpeg n7.1 各平台静态库并发布到 GitHub Release。
#
# 架构设计（遵循 skill）：
#   - 平台配置全部集中在本 YAML（runner / 工具链 / ARCH / 编译参数）。
#   - 构建逻辑复用 scripts/common.sh 通用引擎，平台无业务分支。
#   - 新增依赖时：复制 dependencies/<dep>/build.sh + 本文件对应 Job。
#
# 产物（每个平台打包 ffmpeg-<plat>.tar.gz 上传）：
#   ffmpeg/<plat>/<arch>/{include,lib}
# release Job 汇总并发布到 tag ffmpeg-n7.1 的 Release。
#
# 触发：手动 workflow_dispatch 或 push tag（ffmpeg-*）。
# ============================================================

name: Build FFmpeg Static Libs

on:
  workflow_dispatch:
  push:
    tags:
      - 'ffmpeg-*'

permissions:
  contents: write

env:
  RELEASE_TAG: "ffmpeg-n7.1"

jobs:
  # ============================================================
  # Linux: x86_64
  # ============================================================
  linux:
    name: Linux x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      PLATFORM: linux
      ARCH: x86_64
      ARCH_DIR: x86_64
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y nasm yasm make gcc g++ xz-utils curl
      - name: Build
        run: bash dependencies/ffmpeg/build.sh
      - name: Package
        run: |
          cd "${RUNNER_TEMP}/ffmpeg-stage/ffmpeg"
          tar -czf "${RUNNER_TEMP}/ffmpeg-linux.tar.gz" linux
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-linux
          path: ${{ runner.temp }}/ffmpeg-linux.tar.gz
          if-no-files-found: error

  # ============================================================
  # Windows: x86_64（MSYS2/MinGW64 原生构建）
  # ============================================================
  windows:
    name: Windows x86_64
    runs-on: windows-latest
    timeout-minutes: 150
    defaults:
      run:
        shell: msys2 {0}
    env:
      PLATFORM: windows
      ARCH: x86_64
      ARCH_DIR: x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git make tar mingw-w64-x86_64-gcc mingw-w64-x86_64-nasm
            mingw-w64-x86_64-xz mingw-w64-x86_64-pkgconf
      - name: Build
        run: bash dependencies/ffmpeg/build.sh
      - name: Package
        run: |
          STAGE="$(cygpath -u "${RUNNER_TEMP}/ffmpeg-stage/ffmpeg")"
          OUT="$(cygpath -u "${RUNNER_TEMP}/ffmpeg-windows.tar.gz")"
          cd "${STAGE}"
          tar -czf "${OUT}" windows
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-windows
          path: ${{ runner.temp }}/ffmpeg-windows.tar.gz
          if-no-files-found: error

  # ============================================================
  # macOS: universal（arm64 + x86_64，lipo 合并）
  # ============================================================
  macos:
    name: macOS universal
    runs-on: macos-14
    timeout-minutes: 180
    env:
      PLATFORM: macos
    steps:
      - uses: actions/checkout@v4
      - name: Install deps (nasm for x86_64)
        run: brew install nasm
      - name: Build arm64
        env:
          ARCH: arm64
          ARCH_DIR: arm64
        run: |
          export CC="$(xcrun --sdk macosx --find clang)"
          export SYSROOT="$(xcrun --sdk macosx --show-sdk-path)"
          bash dependencies/ffmpeg/build.sh
      - name: Build x86_64
        env:
          ARCH: x86_64
          ARCH_DIR: x86_64
        run: |
          export CC="$(xcrun --sdk macosx --find clang)"
          export SYSROOT="$(xcrun --sdk macosx --show-sdk-path)"
          bash dependencies/ffmpeg/build.sh
      - name: Merge universal (lipo)
        run: |
          SRC="${RUNNER_TEMP}/ffmpeg-stage/ffmpeg/macos"
          OUT="${SRC}/universal"
          mkdir -p "${OUT}/lib"
          for lib in "${SRC}"/arm64/lib/libav*.a; do
            base="$(basename "${lib}")"
            lipo -create "${SRC}/arm64/lib/${base}" "${SRC}/x86_64/lib/${base}" -output "${OUT}/lib/${base}"
          done
          cp -a "${SRC}/arm64/include" "${OUT}/include"
      - name: Package
        run: |
          cd "${RUNNER_TEMP}/ffmpeg-stage/ffmpeg"
          tar -czf "${RUNNER_TEMP}/ffmpeg-macos.tar.gz" macos
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-macos
          path: ${{ runner.temp }}/ffmpeg-macos.tar.gz
          if-no-files-found: error

  # ============================================================
  # Android: arm64-v8a
  # ============================================================
  android:
    name: Android arm64-v8a
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      PLATFORM: android
      ARCH: aarch64
      ARCH_DIR: arm64-v8a
      ANDROID_ABI: arm64-v8a
      MIN_SDK: "21"
    steps:
      - uses: actions/checkout@v4
      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
          add-to-path: false
      - name: Build
        env:
          NDK: ${{ steps.ndk.outputs.ndk-path }}
          TOOLCHAIN: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64
          CC: "${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang"
          CXX: "${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang++"
          SYSROOT: "${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          EXTRA_CFLAGS: "-DANDROID -fPIC"
          EXTRA_LDFLAGS: "${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/21"
        run: bash dependencies/ffmpeg/build.sh
      - name: Package
        run: |
          cd "${RUNNER_TEMP}/ffmpeg-stage/ffmpeg"
          tar -czf "${RUNNER_TEMP}/ffmpeg-android.tar.gz" android
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-android
          path: ${{ runner.temp }}/ffmpeg-android.tar.gz
          if-no-files-found: error

  # ============================================================
  # iOS: arm64 真机
  # ============================================================
  ios:
    name: iOS arm64
    runs-on: macos-14
    timeout-minutes: 180
    env:
      PLATFORM: ios
      ARCH: arm64
      ARCH_DIR: arm64
    steps:
      - uses: actions/checkout@v4
      - name: Build
        env:
          PLATFORM: ios
          ARCH: arm64
          ARCH_DIR: arm64
        run: |
          export CC="$(xcrun --sdk iphoneos --find clang)"
          export SYSROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          bash dependencies/ffmpeg/build.sh
      - name: Package
        run: |
          cd "${RUNNER_TEMP}/ffmpeg-stage/ffmpeg"
          tar -czf "${RUNNER_TEMP}/ffmpeg-ios.tar.gz" ios
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-ios
          path: ${{ runner.temp }}/ffmpeg-ios.tar.gz
          if-no-files-found: error

  # ============================================================
  # Release: 汇总各平台 tarball 并发布
  # ============================================================
  release:
    name: Publish Release
    runs-on: ubuntu-24.04
    needs: [linux, windows, macos, android, ios]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: List assets
        run: ls -lh release-assets/
      - name: Create/Update Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          gh release delete "${RELEASE_TAG}" --yes --cleanup-tag 2>/dev/null || true
          gh release create "${RELEASE_TAG}" \
            --title "FFmpeg ${RELEASE_TAG}" \
            --notes "FFmpeg n7.1 跨平台静态库（include + lib/<plat>/<arch>）" \
            $(find release-assets -type f -name '*.tar.gz')
          echo "Release 创建完成: ${RELEASE_TAG}"
