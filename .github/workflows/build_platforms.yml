# ============================================================
# build_platforms.yml
# 使用 dependencies 统一入口，每个平台 Job 调用 build.sh <platform>，
# 各库单独打包为 <lib>.tar.gz 上传；release Job 创建单一 GitHub Release
#（tag = latest），附带 Markdown 下载表格，所有平台所有库放在一处。
# 触发：手动 或 push build-* tag。
# ============================================================
name: Build All Platforms

on:
  workflow_dispatch:
  push:
    tags:
      - 'build-*'

permissions:
  contents: write

env:
  DEP_LIBS: "ffmpeg miniz stb_image sqlite python"

jobs:
  # ============================================================
  # Linux x86_64
  # ============================================================
  linux:
    name: Linux x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y nasm yasm make gcc g++ build-essential curl xz-utils zlib1g-dev libssl-dev libffi-dev libreadline-dev libsqlite3-dev libbz2-dev liblzma-dev libncurses-dev libgdbm-dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build
        run: bash dependencies/build.sh linux
       - name: Package
         run: |
           mkdir -p "${RUNNER_TEMP}/pkgs"
           cd release
           tar -czf "${RUNNER_TEMP}/pkgs/linux-x86_64.tar.gz" linux/x86_64
       - uses: actions/upload-artifact@v4
         with:
           name: libs-linux
           path: ${{ runner.temp }}/pkgs
           if-no-files-found: error

  # ============================================================
  # Windows x86_64 (MSYS2/MinGW64)
  # ============================================================
  windows:
    name: Windows x86_64
    runs-on: windows-latest
    timeout-minutes: 240
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git make tar unzip mingw-w64-x86_64-gcc mingw-w64-x86_64-nasm
            mingw-w64-x86_64-xz mingw-w64-x86_64-pkg-config mingw-w64-x86_64-binutils
      - name: Build
        run: bash dependencies/build.sh windows
       - name: Package
         run: |
           mkdir -p "$(cygpath -u "${RUNNER_TEMP}")/pkgs"
           cd release
           tar -czf "$(cygpath -u "${RUNNER_TEMP}")/pkgs/windows-x86_64.tar.gz" windows/x86_64
       - uses: actions/upload-artifact@v4
         with:
           name: libs-windows
           path: ${{ runner.temp }}/pkgs
           if-no-files-found: error

  # ============================================================
  # macOS arm64 + x86_64
  # ============================================================
  macos:
    name: macOS universal
    runs-on: macos-14
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build
        run: bash dependencies/build.sh macos
       - name: Package
         run: |
           mkdir -p "${RUNNER_TEMP}/pkgs"
           cd release
           for arch in arm64 x86_64; do
             tar -czf "${RUNNER_TEMP}/pkgs/macos-${arch}.tar.gz" macos/${arch}
           done
       - uses: actions/upload-artifact@v4
         with:
           name: libs-macos
           path: ${{ runner.temp }}/pkgs
           if-no-files-found: error

  # ============================================================
  # Android (4 architectures)
  # ============================================================
  android:
    name: Android multi-arch
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
          add-to-path: false
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y nasm yasm make gcc g++ build-essential curl xz-utils zlib1g-dev libssl-dev libffi-dev libreadline-dev libsqlite3-dev libbz2-dev liblzma-dev libncurses-dev libgdbm-dev
      - uses: actions/setup-python@v5
        id: hostpy
        with:
          python-version: '3.12'
      - name: Build
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          BUILD_PYTHON: ${{ steps.hostpy.outputs.python-path }}
        run: bash dependencies/build.sh android
       - name: Package
         run: |
           mkdir -p "${RUNNER_TEMP}/pkgs"
           cd release
           for arch in armeabi-v7a arm64-v8a x86 x86_64; do
             tar -czf "${RUNNER_TEMP}/pkgs/android-${arch}.tar.gz" android/${arch}
           done
       - uses: actions/upload-artifact@v4
         with:
           name: libs-android
           path: ${{ runner.temp }}/pkgs
           if-no-files-found: error

  # ============================================================
  # iOS arm64
  # ============================================================
  ios:
    name: iOS arm64
    runs-on: macos-14
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: bash dependencies/build.sh ios
       - name: Package
         run: |
           mkdir -p "${RUNNER_TEMP}/pkgs"
           cd release
           tar -czf "${RUNNER_TEMP}/pkgs/ios-arm64.tar.gz" ios/arm64
       - uses: actions/upload-artifact@v4
         with:
           name: libs-ios
           path: ${{ runner.temp }}/pkgs
           if-no-files-found: error

  # ============================================================
  # Release：单一 GitHub Release，所有平台所有库放在一起
  # ============================================================
  release:
    name: Publish Release
    runs-on: ubuntu-24.04
    needs: [linux, windows, macos, android, ios]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Create Single Release with Download Table
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 收集所有文件
          ALL_FILES=$(find release-assets -name '*.tar.gz' -type f 2>/dev/null | sort)
          if [ -z "${ALL_FILES}" ]; then
            echo "无构建产物，跳过 Release"
            exit 0
          fi

          # 生成 Markdown 下载表格
          # 文件格式：platform-arch.tar.gz (如 linux-x86_64.tar.gz, android-arm64-v8a.tar.gz)
          NOTES="# 预编译库下载\n\n"
          NOTES+="| 平台 | 架构 | 下载 |\n"
          NOTES+="|------|------|------|\n"

          declare -A FILE_MAP
          for f in ${ALL_FILES}; do
            basename=$(basename "$f")
            name="${basename%.tar.gz}"
            plat=$(echo "$name" | cut -d'-' -f1)
            # arch 是平台名之后的所有内容
            arch=$(echo "$name" | sed "s/^${plat}-//")
            FILE_MAP["${plat}|${arch}"]="$basename"
          done

          # 定义平台顺序
          PLATFORMS=("linux" "windows" "macos" "android" "ios")
          ARCHS_LINUX="x86_64"
          ARCHS_WINDOWS="x86_64"
          ARCHS_MACOS="arm64 x86_64"
          ARCHS_ANDROID="armeabi-v7a arm64-v8a x86 x86_64"
          ARCHS_IOS="arm64"

          for plat in "${PLATFORMS[@]}"; do
            case "$plat" in
              linux)   ARCH_LIST=($ARCHS_LINUX) ;;
              windows) ARCH_LIST=($ARCHS_WINDOWS) ;;
              macos)   ARCH_LIST=($ARCHS_MACOS) ;;
              android) ARCH_LIST=($ARCHS_ANDROID) ;;
              ios)     ARCH_LIST=($ARCHS_IOS) ;;
            esac
            for arch in "${ARCH_LIST[@]}"; do
              key="${plat}|${arch}"
              if [ -n "${FILE_MAP[$key]}" ]; then
                NOTES+="| ${plat} | ${arch} | [${FILE_MAP[$key]}](/${FILE_MAP[$key]}) |\n"
              else
                NOTES+="| ${plat} | ${arch} | - |\n"
              fi
            done
          done

          NOTES+="\n> 每个压缩包包含 include/ 和 lib/ 目录，含该平台所有库（ffmpeg, miniz, stb_image, sqlite, python）的预编译产物。\n"

          echo -e "$NOTES" > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

          # 删除旧 release 和 tag
          gh release delete "latest" --yes --cleanup-tag 2>/dev/null || true

          # 创建单一 release，上传所有文件
          gh release create "latest" \
            --title "预编译库（全平台）" \
            --notes-file RELEASE_NOTES.md \
            ${ALL_FILES}

          echo "Release 已发布"
