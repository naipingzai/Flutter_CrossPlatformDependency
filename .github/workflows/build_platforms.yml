# ============================================================
# build_platforms.yml
# 每个平台 Job 自包含编译 5 库（ffmpeg/miniz/stb_image/sqlite/python），
# 各库单独打包为 <lib>.tar.gz 上传；release Job 为每个「平台-库」组合
# 创建独立 GitHub Release（tag = <platform>-<lib>，如 linux-ffmpeg / windows-sqlite）。
# 触发：手动 或 push build-* tag。
# ============================================================
name: Build All Platforms

on:
  workflow_dispatch:
  push:
    tags:
      - 'build-*'

permissions:
  contents: write

env:
  DEP_LIBS: "ffmpeg miniz stb_image sqlite python"

jobs:
  # ============================================================
  # Linux x86_64
  # ============================================================
  linux:
    name: Linux x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y nasm yasm make gcc g++ build-essential curl xz-utils zlib1g-dev libssl-dev libffi-dev libreadline-dev libsqlite3-dev libbz2-dev liblzma-dev libncurses-dev libgdbm-dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build
        run: bash dependencies/linux/build.sh
      - name: Package (per-lib)
        run: |
          mkdir -p "${RUNNER_TEMP}/pkgs"
          cd "${RUNNER_TEMP}/deps-stage"
          for lib in ${{ env.DEP_LIBS }}; do
            d="${lib}/linux/x86_64"
            if [ -d "$d" ]; then (cd "$d" && tar -czf "${RUNNER_TEMP}/pkgs/linux-${lib}.tar.gz" .); fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: libs-linux
          path: ${{ runner.temp }}/pkgs
          if-no-files-found: error

  # ============================================================
  # Windows x86_64（MSYS2/MinGW64）
  # ============================================================
  windows:
    name: Windows x86_64
    runs-on: windows-latest
    timeout-minutes: 240
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git make tar unzip mingw-w64-x86_64-gcc mingw-w64-x86_64-nasm
            mingw-w64-x86_64-xz mingw-w64-x86_64-pkg-config mingw-w64-x86_64-binutils
      - name: Build
        run: bash dependencies/windows/build.sh
      - name: Package (per-lib)
        run: |
          mkdir -p "$(cygpath -u "${RUNNER_TEMP}")/pkgs"
          cd "$(cygpath -u "${RUNNER_TEMP}")/deps-stage"
          for lib in ${{ env.DEP_LIBS }}; do
            d="${lib}/windows/x86_64"
            if [ -d "$d" ]; then (cd "$d" && tar -czf "$(cygpath -u "${RUNNER_TEMP}")/pkgs/windows-${lib}.tar.gz" .); fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: libs-windows
          path: ${{ runner.temp }}/pkgs
          if-no-files-found: error

  # ============================================================
  # macOS arm64
  # ============================================================
  macos:
    name: macOS arm64
    runs-on: macos-14
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build
        run: |
          export CC="$(xcrun --sdk macosx --find clang)"
          export SYSROOT="$(xcrun --sdk macosx --show-sdk-path)"
          bash dependencies/macos/build.sh
      - name: Package (per-lib)
        run: |
          mkdir -p "${RUNNER_TEMP}/pkgs"
          cd "${RUNNER_TEMP}/deps-stage"
          for lib in ${{ env.DEP_LIBS }}; do
            d="${lib}/macos/arm64"
            if [ -d "$d" ]; then (cd "$d" && tar -czf "${RUNNER_TEMP}/pkgs/macos-${lib}.tar.gz" .); fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: libs-macos
          path: ${{ runner.temp }}/pkgs
          if-no-files-found: error

  # ============================================================
  # Android arm64-v8a
  # ============================================================
  android:
    name: Android arm64-v8a
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
          add-to-path: false
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y nasm yasm make gcc g++ build-essential curl xz-utils zlib1g-dev libssl-dev libffi-dev libreadline-dev libsqlite3-dev libbz2-dev liblzma-dev libncurses-dev libgdbm-dev
      - uses: actions/setup-python@v5
        id: hostpy
        with:
          python-version: '3.12'
      - name: Build
        env:
          BUILD_PYTHON: ${{ steps.hostpy.outputs.python-path }}
          HOST_TRIPLE: "aarch64-linux-android"
          BUILD_TRIPLE: "x86_64-linux-gnu"
          CC: "${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang"
          CXX: "${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang++"
          AR: "${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          RANLIB: "${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ranlib"
          STRIP: "${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          SYSROOT: "${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          EXTRA_CFLAGS: "-DANDROID -fPIC"
          EXTRA_LDFLAGS: "-L${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/21"
        run: bash dependencies/android/build.sh
      - name: Package (per-lib)
        run: |
          mkdir -p "${RUNNER_TEMP}/pkgs"
          cd "${RUNNER_TEMP}/deps-stage"
          for lib in ${{ env.DEP_LIBS }}; do
            d="${lib}/android/arm64-v8a"
            if [ -d "$d" ]; then (cd "$d" && tar -czf "${RUNNER_TEMP}/pkgs/android-${lib}.tar.gz" .); fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: libs-android
          path: ${{ runner.temp }}/pkgs
          if-no-files-found: error

  # ============================================================
  # iOS arm64
  # ============================================================
  ios:
    name: iOS arm64
    runs-on: macos-14
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          export CC="$(xcrun --sdk iphoneos --find clang)"
          export SYSROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          bash dependencies/ios/build.sh
      - name: Package (per-lib)
        run: |
          mkdir -p "${RUNNER_TEMP}/pkgs"
          cd "${RUNNER_TEMP}/deps-stage"
          for lib in ${{ env.DEP_LIBS }}; do
            d="${lib}/ios/arm64"
            if [ -d "$d" ]; then (cd "$d" && tar -czf "${RUNNER_TEMP}/pkgs/ios-${lib}.tar.gz" .); fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: libs-ios
          path: ${{ runner.temp }}/pkgs
          if-no-files-found: error

  # ============================================================
  # Release：单一 GitHub Release，所有库独立压缩包 + 下载表格
  # ============================================================
  release:
    name: Publish Release
    runs-on: ubuntu-24.04
    needs: [linux, windows, macos, android, ios]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Create Single Release with Download Table
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 收集所有文件
          ALL_FILES=$(find release-assets -name '*.tar.gz' -type f 2>/dev/null | sort)
          if [ -z "${ALL_FILES}" ]; then
            echo "无构建产物，跳过 Release"
            exit 0
          fi

          # 解析文件名：platform-lib.tar.gz
          declare -A FILE_MAP
          for f in ${ALL_FILES}; do
            b=$(basename "$f")
            n="${b%.tar.gz}"
            plat=$(echo "$n" | cut -d'-' -f1)
            lib=$(echo "$n" | sed "s/^${plat}-//")
            FILE_MAP["${lib}|${plat}"]="$b"
          done

          # 生成 Markdown 下载表格
          LIBS=("ffmpeg" "miniz" "stb_image" "sqlite" "python")
          PLATFORMS=("linux" "windows" "macos" "android" "ios")

          NOTES="# 预编译库下载\n\n"
          NOTES+="| 库 | linux | windows | macos | android | ios |\n"
          NOTES+="|----|-------|---------|-------|---------|-----|\n"

          for lib in "${LIBS[@]}"; do
            ROW="| ${lib} |"
            for plat in "${PLATFORMS[@]}"; do
              key="${lib}|${plat}"
              if [ -n "${FILE_MAP[$key]}" ]; then
                ROW+=" [${FILE_MAP[$key]}](/${FILE_MAP[$key]}) |"
              else
                ROW+=" - |"
              fi
            done
            NOTES+="${ROW}\n"
          done

          NOTES+="\n> 每个压缩包包含单一库在单一平台下的预编译产物（include/ + lib/）。\n"

          echo -e "$NOTES" > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

          # 删除旧 per-platform releases 和 tags
          for tag in linux windows macos android ios latest; do
            gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          done

          # 创建单一 release，上传所有文件
          gh release create "latest" \
            --title "预编译库（全平台）" \
            --notes-file RELEASE_NOTES.md \
            ${ALL_FILES}

          echo "Release 已发布"
