# ============================================================
# build_platforms.yml
# 每个平台 Job 自包含编译 5 库（ffmpeg/miniz/stb_image/sqlite/python），
# 各库单独打包为 <lib>.tar.gz 上传；release Job 为每个「平台-库」组合
# 创建独立 GitHub Release（tag = <platform>-<lib>，如 linux-ffmpeg / windows-sqlite）。
# 触发：手动 或 push build-* tag。
# ============================================================
name: Build All Platforms

on:
  workflow_dispatch:
  push:
    tags:
      - 'build-*'

permissions:
  contents: write

env:
  LIBS: "ffmpeg miniz stb_image sqlite python"

jobs:
  # ============================================================
  # Linux x86_64
  # ============================================================
  linux:
    name: Linux x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y nasm yasm make gcc g++ build-essential curl xz-utils
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build
        run: bash dependencies/linux/build.sh
      - name: Package (per-lib)
        run: |
          mkdir -p "${RUNNER_TEMP}/pkgs"
          cd "${RUNNER_TEMP}/deps-stage"
          for lib in ${{ env.LIBS }}; do
            d="${lib}/linux/x86_64"
            if [ -d "$d" ]; then (cd "$d" && tar -czf "${RUNNER_TEMP}/pkgs/linux-${lib}.tar.gz" .); fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: libs-linux
          path: ${{ runner.temp }}/pkgs
          if-no-files-found: error

  # ============================================================
  # Windows x86_64（MSYS2/MinGW64）
  # ============================================================
  windows:
    name: Windows x86_64
    runs-on: windows-latest
    timeout-minutes: 240
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git make tar mingw-w64-x86_64-gcc mingw-w64-x86_64-nasm
            mingw-w64-x86_64-xz mingw-w64-x86_64-pkg-config
      - name: Build
        run: bash dependencies/windows/build.sh
      - name: Package (per-lib)
        run: |
          mkdir -p "$(cygpath -u "${RUNNER_TEMP}")/pkgs"
          cd "$(cygpath -u "${RUNNER_TEMP}")/deps-stage"
          for lib in ${{ env.LIBS }}; do
            d="${lib}/windows/x86_64"
            if [ -d "$d" ]; then (cd "$d" && tar -czf "$(cygpath -u "${RUNNER_TEMP}")/pkgs/windows-${lib}.tar.gz" .); fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: libs-windows
          path: ${{ runner.temp }}/pkgs
          if-no-files-found: error

  # ============================================================
  # macOS arm64
  # ============================================================
  macos:
    name: macOS arm64
    runs-on: macos-14
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build
        run: |
          export CC="$(xcrun --sdk macosx --find clang)"
          export SYSROOT="$(xcrun --sdk macosx --show-sdk-path)"
          bash dependencies/macos/build.sh
      - name: Package (per-lib)
        run: |
          mkdir -p "${RUNNER_TEMP}/pkgs"
          cd "${RUNNER_TEMP}/deps-stage"
          for lib in ${{ env.LIBS }}; do
            d="${lib}/macos/arm64"
            if [ -d "$d" ]; then (cd "$d" && tar -czf "${RUNNER_TEMP}/pkgs/macos-${lib}.tar.gz" .); fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: libs-macos
          path: ${{ runner.temp }}/pkgs
          if-no-files-found: error

  # ============================================================
  # Android arm64-v8a
  # ============================================================
  android:
    name: Android arm64-v8a
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
          add-to-path: false
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y nasm yasm make gcc g++ build-essential curl xz-utils
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build
        env:
          BUILD_PYTHON: "python3.12"
          CC: "${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang"
          AR: "${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          SYSROOT: "${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          EXTRA_CFLAGS: "-DANDROID -fPIC"
          EXTRA_LDFLAGS: "-L${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/21"
        run: bash dependencies/android/build.sh
      - name: Package (per-lib)
        run: |
          mkdir -p "${RUNNER_TEMP}/pkgs"
          cd "${RUNNER_TEMP}/deps-stage"
          for lib in ${{ env.LIBS }}; do
            d="${lib}/android/arm64-v8a"
            if [ -d "$d" ]; then (cd "$d" && tar -czf "${RUNNER_TEMP}/pkgs/android-${lib}.tar.gz" .); fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: libs-android
          path: ${{ runner.temp }}/pkgs
          if-no-files-found: error

  # ============================================================
  # iOS arm64
  # ============================================================
  ios:
    name: iOS arm64
    runs-on: macos-14
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          export CC="$(xcrun --sdk iphoneos --find clang)"
          export SYSROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          bash dependencies/ios/build.sh
      - name: Package (per-lib)
        run: |
          mkdir -p "${RUNNER_TEMP}/pkgs"
          cd "${RUNNER_TEMP}/deps-stage"
          for lib in ${{ env.LIBS }}; do
            d="${lib}/ios/arm64"
            if [ -d "$d" ]; then (cd "$d" && tar -czf "${RUNNER_TEMP}/pkgs/ios-${lib}.tar.gz" .); fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: libs-ios
          path: ${{ runner.temp }}/pkgs
          if-no-files-found: error

  # ============================================================
  # Release：按「平台-库」创建独立 GitHub Release（tag = <platform>-<lib>）
  # ============================================================
  release:
    name: Publish Releases (per platform-lib)
    runs-on: ubuntu-24.04
    needs: [linux, windows, macos, android, ios]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Create per-platform Releases (含各库 tarball)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for plat in linux windows macos android ios; do
            FILES=$(ls "release-assets/libs-${plat}"/*.tar.gz 2>/dev/null || true)
            if [ -n "${FILES}" ]; then
              gh release delete "${plat}" --yes --cleanup-tag 2>/dev/null || true
              gh release create "${plat}" --title "${plat} 预编译库" \
                --notes "ffmpeg / miniz / stb_image / sqlite / python（每库一个 tarball）" \
                ${FILES}
              echo "${plat} 已发布"
            else
              echo "${plat} 无产物，跳过"
            fi
          done
