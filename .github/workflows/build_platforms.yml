# ============================================================
# build_platforms.yml
# 使用 dependencies 统一入口，每个平台 Job 调用 build.sh <platform>，
# 各库单独打包为 <lib>.tar.gz 上传；release Job 创建单一 GitHub Release
#（tag = latest），附带 Markdown 下载表格，所有平台所有库放在一处。
# 触发：手动 或 push build-* tag。
# ============================================================
name: Build All Platforms

on:
  workflow_dispatch:
  push:
    tags:
      - 'build-*'

permissions:
  contents: write

env:
  DEP_LIBS: "ffmpeg miniz stb_image sqlite python"

jobs:
  # ============================================================
  # Linux x86_64
  # ============================================================
  linux:
    name: Linux x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y nasm yasm make gcc g++ build-essential curl xz-utils zlib1g-dev libssl-dev libffi-dev libreadline-dev libsqlite3-dev libbz2-dev liblzma-dev libncurses-dev libgdbm-dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build
        run: bash dependencies/build.sh linux
      - name: Package (per-lib)
        run: |
          mkdir -p "${RUNNER_TEMP}/pkgs"
          cd release/linux/x86_64
          for lib in ${{ env.DEP_LIBS }}; do
            if [ -d "${lib}" ]; then (cd "${lib}" && tar -czf "${RUNNER_TEMP}/pkgs/linux-${lib}.tar.gz" .); fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: libs-linux
          path: ${{ runner.temp }}/pkgs
          if-no-files-found: error

  # ============================================================
  # Windows x86_64 (MSYS2/MinGW64)
  # ============================================================
  windows:
    name: Windows x86_64
    runs-on: windows-latest
    timeout-minutes: 240
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git make tar unzip mingw-w64-x86_64-gcc mingw-w64-x86_64-nasm
            mingw-w64-x86_64-xz mingw-w64-x86_64-pkg-config mingw-w64-x86_64-binutils
      - name: Build
        run: bash dependencies/build.sh windows
      - name: Package (per-lib)
        run: |
          mkdir -p "$(cygpath -u "${RUNNER_TEMP}")/pkgs"
          cd release/windows/x86_64
          for lib in ${{ env.DEP_LIBS }}; do
            if [ -d "${lib}" ]; then (cd "${lib}" && tar -czf "$(cygpath -u "${RUNNER_TEMP}")/pkgs/windows-${lib}.tar.gz" .); fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: libs-windows
          path: ${{ runner.temp }}/pkgs
          if-no-files-found: error

  # ============================================================
  # macOS arm64 + x86_64
  # ============================================================
  macos:
    name: macOS universal
    runs-on: macos-14
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build
        run: bash dependencies/build.sh macos
      - name: Package (per-lib per-arch)
        run: |
          mkdir -p "${RUNNER_TEMP}/pkgs"
          for arch in arm64 x86_64; do
            cd release/macos/${arch}
            for lib in ${{ env.DEP_LIBS }}; do
              if [ -d "${lib}" ]; then (cd "${lib}" && tar -czf "${RUNNER_TEMP}/pkgs/macos-${lib}-${arch}.tar.gz" .); fi
            done
          done
      - uses: actions/upload-artifact@v4
        with:
          name: libs-macos
          path: ${{ runner.temp }}/pkgs
          if-no-files-found: error

  # ============================================================
  # Android (4 architectures)
  # ============================================================
  android:
    name: Android multi-arch
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
          add-to-path: false
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y nasm yasm make gcc g++ build-essential curl xz-utils zlib1g-dev libssl-dev libffi-dev libreadline-dev libsqlite3-dev libbz2-dev liblzma-dev libncurses-dev libgdbm-dev
      - uses: actions/setup-python@v5
        id: hostpy
        with:
          python-version: '3.12'
      - name: Build
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          BUILD_PYTHON: ${{ steps.hostpy.outputs.python-path }}
        run: bash dependencies/build.sh android
      - name: Package (per-lib per-arch)
        run: |
          mkdir -p "${RUNNER_TEMP}/pkgs"
          for arch in armeabi-v7a arm64-v8a x86 x86_64; do
            cd release/android/${arch}
            for lib in ${{ env.DEP_LIBS }}; do
              if [ -d "${lib}" ]; then (cd "${lib}" && tar -czf "${RUNNER_TEMP}/pkgs/android-${lib}-${arch}.tar.gz" .); fi
            done
          done
      - uses: actions/upload-artifact@v4
        with:
          name: libs-android
          path: ${{ runner.temp }}/pkgs
          if-no-files-found: error

  # ============================================================
  # iOS arm64
  # ============================================================
  ios:
    name: iOS arm64
    runs-on: macos-14
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: bash dependencies/build.sh ios
      - name: Package (per-lib)
        run: |
          mkdir -p "${RUNNER_TEMP}/pkgs"
          cd release/ios/arm64
          for lib in ${{ env.DEP_LIBS }}; do
            if [ -d "${lib}" ]; then (cd "${lib}" && tar -czf "${RUNNER_TEMP}/pkgs/ios-${lib}.tar.gz" .); fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: libs-ios
          path: ${{ runner.temp }}/pkgs
          if-no-files-found: error

  # ============================================================
  # Release：单一 GitHub Release，所有平台所有库放在一起
  # ============================================================
  release:
    name: Publish Release
    runs-on: ubuntu-24.04
    needs: [linux, windows, macos, android, ios]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Create Single Release with Download Table
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 收集所有文件
          ALL_FILES=$(find release-assets -name '*.tar.gz' -type f 2>/dev/null | sort)
          if [ -z "${ALL_FILES}" ]; then
            echo "无构建产物，跳过 Release"
            exit 0
          fi

          # 生成 Markdown 下载表格
          NOTES="# 预编译库下载\n\n"
          NOTES+="| 平台 | 架构 | ffmpeg | miniz | stb_image | sqlite | python |\n"
          NOTES+="|------|------|--------|-------|-----------|--------|--------|\n"

          declare -A FILE_MAP
          for f in ${ALL_FILES}; do
            basename=$(basename "$f")
            # 解析文件名：platform-lib-arch.tar.gz 或 platform-lib.tar.gz
            # 移除 .tar.gz
            name="${basename%.tar.gz}"
            # 提取平台（第一段）
            plat=$(echo "$name" | cut -d'-' -f1)
            # 提取库名（最后一段之前的是架构，最后一段之前的是库...）
            # 格式：linux-ffmpeg, linux-ffmpeg, macos-ffmpeg-arm64, android-ffmpeg-arm64-v8a
            # 从后往前：最后是 arch（可能含连字符），然后是 lib
            case "$plat" in
              android)
                # android-lib-arch：arch 可能是 armeabi-v7a / arm64-v8a / x86 / x86_64
                arch=$(echo "$name" | sed "s/^${plat}-[${a-z}_]*-//" )
                lib=$(echo "$name" | sed "s/^${plat}-//" | sed "s/-${arch}$//")
                ;;
              macos)
                # macos-lib-arch：arch 是 arm64 / x86_64
                arch=$(echo "$name" | rev | cut -d'-' -f1 | rev)
                lib=$(echo "$name" | sed "s/^${plat}-//" | sed "s/-${arch}$//")
                ;;
              ios)
                # ios-lib
                lib=$(echo "$name" | sed "s/^${plat}-//")
                arch="arm64"
                ;;
              *)
                # linux-lib, windows-lib
                lib=$(echo "$name" | sed "s/^${plat}-//")
                arch="x86_64"
                ;;
            esac
            FILE_MAP["${plat}|${arch}|${lib}"]="$basename"
          done

          # 定义平台顺序
          PLATFORMS=("linux" "windows" "macos" "android" "ios")
          ARCHS_LINUX="x86_64"
          ARCHS_WINDOWS="x86_64"
          ARCHS_MACOS="arm64 x86_64"
          ARCHS_ANDROID="armeabi-v7a arm64-v8a x86 x86_64"
          ARCHS_IOS="arm64"
          LIBS="ffmpeg miniz stb_image sqlite python"

          for plat in "${PLATFORMS[@]}"; do
            case "$plat" in
              linux)   ARCH_LIST=($ARCHS_LINUX) ;;
              windows) ARCH_LIST=($ARCHS_WINDOWS) ;;
              macos)   ARCH_LIST=($ARCHS_MACOS) ;;
              android) ARCH_LIST=($ARCHS_ANDROID) ;;
              ios)     ARCH_LIST=($ARCHS_IOS) ;;
            esac
            for arch in "${ARCH_LIST[@]}"; do
              ROW="| ${plat} | ${arch} |"
              FIRST_LIB=true
              for lib in $LIBS; do
                key="${plat}|${arch}|${lib}"
                if [ -n "${FILE_MAP[$key]}" ]; then
                  if [ "$FIRST_LIB" = true ]; then
                    ROW+=" [${FILE_MAP[$key]}](/${FILE_MAP[$key]}) |"
                    FIRST_LIB=false
                  else
                    ROW+=" [${FILE_MAP[$key]}](/${FILE_MAP[$key]}) |"
                  fi
                else
                  ROW+=" - |"
                fi
              done
              # 去掉末尾空格
              ROW=$(echo "$ROW" | sed 's/ |$//')
              NOTES+="${ROW}\n"
            done
          done

          echo -e "$NOTES" > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

          # 删除旧 release 和 tag
          gh release delete "latest" --yes --cleanup-tag 2>/dev/null || true

          # 创建单一 release，上传所有文件
          gh release create "latest" \
            --title "预编译库（全平台）" \
            --notes-file RELEASE_NOTES.md \
            ${ALL_FILES}

          echo "Release 已发布"
